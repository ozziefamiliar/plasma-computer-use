[package]
name = "pcu-stdio"
version = "0.1.0"
edition = "2021"
description = "Thin line-delimited JSON-RPC 2.0 stdio transport for the pcu MCP adapter: no server framework, just message framing."

[[bin]]
name = "pcu-stdio"
path = "src/main.rs"

[lib]
name = "pcu_stdio"
path = "src/lib.rs"

[dependencies]
pcu-core = { path = "../core" }
pcu-mcp = { path = "../mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
